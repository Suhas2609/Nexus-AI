version: '3.8'

services:
  nexus_api:
    build:
      context: ../
      dockerfile: docker/Dockerfile.api
    container_name: nexus_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    networks:
      - nexus_network

  nexus_frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
    container_name: nexus_frontend
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    depends_on:
      - nexus_api
    networks:
      - nexus_network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_automation
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${n8n_password}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../data/documents:/data/documents
    networks:
      - nexus_network

networks:
  nexus_network:
    driver: bridge

volumes:
  n8n_data: