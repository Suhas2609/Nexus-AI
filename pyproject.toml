[project]
name = "nexus-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.0",
    "datasets>=4.8.5",
    "fastapi>=0.111.0",
    "google-generativeai>=0.7.0",
    "groq>=0.9.0",
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-groq>=1.1.2",
    "langgraph>=0.2.0",
    "langsmith>=0.1.75",
    "plotly>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.27",
    "ragas>=0.1.9",
    "streamlit>=1.35.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
